<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Atlas</title>
<style>body{margin:0;background:#050505;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:28px}.a{font-size:42px;font-weight:900;letter-spacing:.16em}.s{color:#aaa;margin-top:10px}</style></head>
<body><div class="box"><div class="a">ATLAS</div><div class="s">Preparando a nova instalação…</div></div>
<script>
(async()=>{
 try{
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.filter(r=>r.scope.endsWith('/treino-kayque/')).map(r=>r.unregister()));
   }
   if('caches' in window){
     for(const k of await caches.keys()) if(k.startsWith('atlas-')&&!k.startsWith('atlas-app-')) await caches.delete(k);
   }
 }catch(e){}
 location.replace('./atlas/?v=300');
})();
</script></body></html>
